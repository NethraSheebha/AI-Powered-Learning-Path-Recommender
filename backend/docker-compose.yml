version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ai_learning_path_postgres
    restart: always
    environment:
      POSTGRES_USER: ai_learning_path_user
      POSTGRES_PASSWORD: ai_learning_path_pass
      POSTGRES_DB: ai_learning_path_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_learning_path_user -d ai_learning_path_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ai_learning_path_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai_learning_path_user:ai_learning_path_pass@db:5432/ai_learning_path_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
